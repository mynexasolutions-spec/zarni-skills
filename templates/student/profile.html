{% extends "dashboard_base.html" %}
{% block title %}Profile – Zarni Skills{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block body %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
    <!-- Avatar -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-full overflow-hidden mb-3">
        <img src="{{ current_user.profile_image_url }}" alt="{{ current_user.name }}" class="w-full h-full object-cover" />
      </div>
      <p class="font-semibold text-gray-900">{{ current_user.name }}</p>
      <p class="text-sm text-gray-400">{{ current_user.email }}</p>
      <span class="mt-1 px-2 py-0.5 bg-primary/10 text-primary text-xs font-medium rounded-full">
        {{ current_user.role|capitalize }}
      </span>
    </div>

    <form method="POST" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5" for="name">Full Name</label>
        <input id="name" name="name" type="text" value="{{ current_user.name }}"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input type="email" value="{{ current_user.email }}" disabled
               class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 text-sm cursor-not-allowed" />
        <p class="text-xs text-gray-400 mt-1">Email cannot be changed.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5" for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" value="{{ current_user.phone or '' }}"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Referral Code</label>
        <div class="flex gap-2">
          <input type="text" value="{{ current_user.referral_code }}" readonly
                 class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-600 text-sm outline-none font-mono" />
          <button type="button" onclick="copyCode()"
                  class="px-4 py-2.5 bg-gray-100 text-gray-600 text-sm rounded-xl hover:bg-gray-200 transition">
            Copy
          </button>
        </div>
      </div>

      <button type="submit"
              class="w-full py-3 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition text-sm">
        Save Changes
      </button>
    </form>
  </div>
</div>

<script>
function copyCode() {
  const code = '{{ current_user.referral_code }}';
  navigator.clipboard.writeText(code).then(() => {
    alert('Referral code copied!');
  });
}
</script>
{% endblock %}
