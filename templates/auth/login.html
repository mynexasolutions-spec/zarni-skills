{% extends "base.html" %}
{% block title %}Login – Zarni Skills{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}" />
{% endblock %}

{% block content %}
{% include 'partials/navbar.html' %}
<div class="auth-bg min-h-screen flex items-center justify-center p-4 pt-32">
  <div class="auth-card bg-white rounded-2xl shadow-xl w-full max-w-md p-8">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-20 h-20 rounded-2xl bg-white shadow-lg border border-primary/10 flex items-center justify-center mb-4 p-2">
        <img src="{{ url_for('static', filename='img/zarni-logo.png') }}" alt="Zarni Skills" class="w-full h-auto object-contain" />
      </div>
      <h1 class="font-heading font-bold text-2xl text-gray-900">Welcome back</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to your Zarni Skills account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               value="{{ request.form.get('email', '') }}"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5" for="password">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition pr-10" />
          <button type="button" onclick="togglePwd('password')"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit"
              class="w-full py-3 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition text-sm">
        Sign In
      </button>
    </form>

    <p class="text-center text-sm mt-4">
      <a href="{{ url_for('auth.forgot_password') }}" class="text-gray-500 hover:text-primary transition">
        Forgot your password?
      </a>
    </p>

    <p class="text-center text-sm text-gray-500 mt-2">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="text-primary font-medium hover:underline">Sign up</a>
    </p>

  </div>
</div>

<script>
function togglePwd(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
